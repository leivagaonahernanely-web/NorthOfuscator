plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vantaoptimized.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vantaoptimized.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Verifica en https://github.com/RikkaApps/Shizuku-API que sea la última versión estable.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    // Verifica la última versión en developers.google.com/admob/android/quick-start
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
