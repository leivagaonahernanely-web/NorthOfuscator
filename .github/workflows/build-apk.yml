name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK preinstalado
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar wrapper de Gradle
        run: gradle wrapper --gradle-version 8.9

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: VantaOptimized-debug
          path: app/build/outputs/apk/debug/*.apk
